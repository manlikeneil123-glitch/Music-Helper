# Runs the tests, then publishes the app/ folder to GitHub Pages over HTTPS,
# so the PWA can be installed on a phone (and use the microphone).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/optimistic-newton-ctacsp]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/analysis.test.mjs
      - run: node tests/musicxml.test.mjs
      - run: node tests/tuning.test.mjs
      - run: node tests/mic-synthetic.test.mjs
      - run: node tests/sync.test.mjs
      - run: node tests/continuity.test.mjs
      - run: node tests/plan.test.mjs
      - run: node tests/exam.test.mjs
      - run: node tests/teach.test.mjs
      - run: node tests/dynamics.test.mjs
      - run: node tests/kit.test.mjs
      - run: node tests/contrast.test.mjs
      - run: node tests/copy.test.mjs
      # Account security rules on a throwaway Postgres (preinstalled on GitHub's Ubuntu runners).
      - run: sh tests/db/run.sh

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
