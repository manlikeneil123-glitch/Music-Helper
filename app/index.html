<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stave · Piano practice</title>
  <meta name="description" content="Stave: piano practice that gets you exam-ready. Note flashcards, a daily plan and play-along feedback.">
  <meta name="theme-color" content="#0d1014">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preload" as="image" href="img/piano-room-1920.webp" media="not all and (max-width: 700px) and (orientation: portrait)">
  <link rel="preload" as="image" href="img/piano-room-900.webp" media="(max-width: 700px) and (orientation: portrait)">
  <script src="js/theme-boot.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="booting">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="mark-g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#4d8dff"/><stop offset="0.6" stop-color="#8edbbb"/><stop offset="1" stop-color="#6ee19a"/></linearGradient></defs></svg>
  <div class="orbs" aria-hidden="true"><i></i><i></i><i></i></div>
  <header class="topbar"><span class="logo-tile brand-mark" aria-hidden="true" id="top-mark"></span><span class="brand-name">Stave</span><span class="spacer"></span><span class="top-pill" id="top-streak" hidden></span><button class="avatar" id="top-avatar" type="button" aria-label="Account and settings" hidden></button></header>
  <main>
    <noscript>
      <h1>Stave: piano practice that gets you exam-ready</h1>
      <p>Note-reading flashcards, a daily practice plan built from your grade and your weak bars, and play-along feedback on every note, for ABRSM and Trinity exams (including Performance Grades). Stave needs JavaScript turned on.</p>
      <p><a href="help.html">Help and support</a> · <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a> · <a href="accessibility.html">Accessibility</a></p>
    </noscript>
    <section class="view" id="view-welcome"></section>
    <section class="view" id="view-today"></section>
    <section class="view" id="view-cards"></section>
    <section class="view" id="view-practice"></section>
    <section class="view" id="view-play"></section>
    <section class="view" id="view-exam"></section>
    <section class="view" id="view-account"></section>
  </main>
  <div class="keyboard" id="keyboard" hidden></div>
  <nav class="tabbar" aria-label="Sections">
    <button type="button" data-tab="today"><span data-icon="home"></span><span class="label">Today</span><span class="tip" aria-hidden="true">Today</span></button>
    <button type="button" data-tab="cards"><span data-icon="cards"></span><span class="label">Read</span><span class="tip" aria-hidden="true">Read</span></button>
    <button type="button" data-tab="practice"><span data-icon="timer"></span><span class="label">Practise</span><span class="tip" aria-hidden="true">Practise</span></button>
    <button type="button" data-tab="play"><span data-icon="piano"></span><span class="label">Perform</span><span class="tip" aria-hidden="true">Perform</span></button>
    <button type="button" data-tab="exam"><span data-icon="trophy"></span><span class="label">Exam</span><span class="tip" aria-hidden="true">Exam</span></button>
  </nav>
  <script type="module" src="js/app.js"></script>
</body>
</html>
